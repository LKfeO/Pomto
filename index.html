<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponto">
<meta name="theme-color" content="#181A20">
<title>Ponto</title>
<style>
  :root{
    --bg:#181A20;
    --surface:#1F232B;
    --border:#2A2F3A;
    --text:#ECEDEF;
    --text-dim:#868D9C;
    --green:#45B87B;
    --green-dim:#2E8C5A;
    --red:#E2574C;
    --red-dim:#B33C33;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
    overflow:hidden;
  }
  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .app__header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;
    flex-shrink:0;
  }
  .app__title{
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .app__status{
    font-size:14px;
    color:var(--green);
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }
  .history{
    flex:1;
    overflow-y:auto;
    padding:0 20px 12px;
    -webkit-overflow-scrolling:touch;
  }
  .empty{
    color:var(--text-dim);
    font-size:15px;
    text-align:center;
    margin-top:60px;
    line-height:1.5;
    padding:0 24px;
  }
  .day-group{ margin-bottom:22px; }
  .day-label{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:500;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 2px;
    border-bottom:1px solid var(--border);
  }
  .entry:last-child{ border-bottom:none; }
  .entry-dot{
    width:8px; height:8px;
    border-radius:50%;
    flex-shrink:0;
  }
  .entry--in .entry-dot{ background:var(--green); }
  .entry--out .entry-dot{ background:var(--red); }
  .entry-label{ font-size:15px; }
  .entry-time{
    margin-left:auto;
    font-size:15px;
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }
  .controls{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:16px 20px calc(env(safe-area-inset-bottom) + 16px);
    border-top:1px solid var(--border);
  }
  .btn-calendar{
    width:48px; height:48px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .btn-calendar:active{ background:var(--border); }
  .btn-toggle{
    width:76px; height:76px;
    border-radius:50%;
    border:none;
    background:var(--green);
    color:#0E1712;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px color-mix(in srgb, var(--green) 16%, transparent);
    transition:background .2s ease, box-shadow .2s ease;
  }
  .btn-toggle:active{ background:var(--green-dim); }
  .btn-toggle.is-on{
    background:var(--red);
    color:#1A0D0B;
    box-shadow:0 0 0 6px color-mix(in srgb, var(--red) 16%, transparent);
  }
  .btn-toggle.is-on:active{ background:var(--red-dim); }
  button{ font:inherit; }
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:10;
  }
  .overlay.hidden{ display:none; }
  .overlay__panel{
    width:100%;
    max-width:520px;
    max-height:70vh;
    background:var(--surface);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    padding:18px 20px calc(env(safe-area-inset-bottom) + 18px);
    display:flex;
    flex-direction:column;
  }
  .overlay__header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    flex-shrink:0;
  }
  .overlay__header span{ font-size:16px; font-weight:600; }
  .overlay__header button{
    background:none; border:none; color:var(--text-dim);
    font-size:18px; padding:4px 8px;
  }
  .overlay__list{ overflow-y:auto; }
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px;
    border-bottom:1px solid var(--border);
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-date{ font-size:15px; }
  .summary-duration{
    font-size:15px;
    color:var(--green);
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }
</style>
</head>
<body>
<div class="app">
  <div class="app__header">
    <span class="app__title">Ponto</span>
    <span class="app__status" id="statusLive"></span>
  </div>
  <main class="history" id="historyList"></main>
  <div class="controls">
    <button class="btn-calendar" id="calendarBtn" aria-label="Ver resumo diário"></button>
    <button class="btn-toggle" id="toggleBtn" aria-label="Registrar entrada"></button>
  </div>
</div>

<div class="overlay hidden" id="summaryOverlay">
  <div class="overlay__panel">
    <div class="overlay__header">
      <span>Resumo diário</span>
      <button id="closeSummary">✕</button>
    </div>
    <div class="overlay__list" id="summaryList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'eventos';
let events = [];
let liveInterval = null;

const ARROW_UP = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
const ARROW_DOWN = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>';
const CALENDAR_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="16" y1="3" x2="16" y2="7"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
document.getElementById('calendarBtn').innerHTML = CALENDAR_ICON;

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtTime(ts){
  const d = new Date(ts);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDateKey(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  const todayKey = fmtDateKey(Date.now());
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestKey = fmtDateKey(yest.getTime());
  if(key===todayKey) return 'Hoje';
  if(key===yestKey) return 'Ontem';
  return pad(d)+'/'+pad(m)+'/'+y;
}
function fmtDuration(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return h+'h '+pad(m)+'min';
  if(m>0) return m+'min '+pad(s)+'s';
  return s+'s';
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    events = raw ? JSON.parse(raw) : [];
  }catch(e){
    events = [];
  }
  render();
  startLive();
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  }catch(e){
    console.error('Falha ao salvar', e);
  }
}

function isOn(){
  return events.length>0 && events[events.length-1].type==='in';
}

function toggle(){
  events.push({ type: isOn() ? 'out' : 'in', ts: Date.now() });
  save();
  render();
  startLive();
}

function render(){
  const btn = document.getElementById('toggleBtn');
  const on = isOn();
  btn.classList.toggle('is-on', on);
  btn.setAttribute('aria-label', on ? 'Registrar saída' : 'Registrar entrada');
  btn.innerHTML = on ? ARROW_DOWN : ARROW_UP;
  renderHistory();
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(events.length===0){
    list.innerHTML = '<p class="empty">Nenhum registro ainda.<br>Toque no botão verde para começar.</p>';
    return;
  }
  const groups = {};
  const order = [];
  for(const ev of events){
    const key = fmtDateKey(ev.ts);
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(ev);
  }
  order.reverse();
  let html = '';
  for(const key of order){
    html += '<div class="day-group"><div class="day-label">'+fmtDateLabel(key)+'</div>';
    const evs = groups[key].slice().reverse();
    for(const ev of evs){
      const cls = ev.type==='in' ? 'entry entry--in' : 'entry entry--out';
      const label = ev.type==='in' ? 'Entrada' : 'Saída';
      html += '<div class="'+cls+'"><span class="entry-dot"></span><span class="entry-label">'+label+'</span><span class="entry-time">'+fmtTime(ev.ts)+'</span></div>';
    }
    html += '</div>';
  }
  list.innerHTML = html;
}

function computeDailyTotals(){
  const totals = {};
  function addRange(startTs, endTs){
    let cursor = startTs;
    while(cursor < endTs){
      const d = new Date(cursor);
      const nextMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 0,0,0,0).getTime();
      const segEnd = Math.min(endTs, nextMidnight);
      const key = fmtDateKey(cursor);
      totals[key] = (totals[key]||0) + (segEnd - cursor);
      cursor = segEnd;
    }
  }
  let openStart = null;
  for(const ev of events){
    if(ev.type==='in'){ openStart = ev.ts; }
    else if(ev.type==='out' && openStart!==null){
      addRange(openStart, ev.ts);
      openStart = null;
    }
  }
  if(openStart!==null){ addRange(openStart, Date.now()); }
  return totals;
}

function renderSummary(){
  const totals = computeDailyTotals();
  const keys = Object.keys(totals).sort().reverse();
  const list = document.getElementById('summaryList');
  if(keys.length===0){
    list.innerHTML = '<p class="empty">Nenhum dia registrado ainda.</p>';
    return;
  }
  let html = '';
  for(const key of keys){
    html += '<div class="summary-row"><span class="summary-date">'+fmtDateLabel(key)+'</span><span class="summary-duration">'+fmtDuration(totals[key])+'</span></div>';
  }
  list.innerHTML = html;
}

function startLive(){
  if(liveInterval) clearInterval(liveInterval);
  updateLive();
  liveInterval = setInterval(updateLive, 1000);
}

function updateLive(){
  const el = document.getElementById('statusLive');
  if(!isOn()){ el.textContent = ''; return; }
  const totals = computeDailyTotals();
  const todayKey = fmtDateKey(Date.now());
  el.textContent = fmtDuration(totals[todayKey] || 0) + ' hoje';
}

document.getElementById('toggleBtn').addEventListener('click', toggle);
document.getElementById('calendarBtn').addEventListener('click', ()=>{
  renderSummary();
  document.getElementById('summaryOverlay').classList.remove('hidden');
});
document.getElementById('closeSummary').addEventListener('click', ()=>{
  document.getElementById('summaryOverlay').classList.add('hidden');
});

load();
</script>
</body>
</html>
